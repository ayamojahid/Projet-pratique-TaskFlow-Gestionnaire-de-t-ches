
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Gestionnaire de tâches</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="js/main.js" type="module"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>

<body class="min-h-screen bg-[#F5F6F1] text-[#30291F]">

    <!-- HEADER -->
    <header class="bg-[#394B32] text-white shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">

            <div class="flex items-center gap-3">
                <div class="bg-white/15 w-11 h-11 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>

                <div>
                    <h1 class="text-2xl font-bold tracking-tight">TaskFlow</h1>
                    <p class="text-xs text-green-100">Organisez votre travail simplement</p>
                </div>
            </div>

            <span class="text-sm text-green-100 hidden sm:block">
                <i class="fa-regular fa-calendar mr-2"></i>
                Gestionnaire de tâches
            </span>

        </div>
    </header>


<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
        <!-- SECTION 1 -->
        <section id="section1">

            <div class="mb-8">
              <h2 class="text-2xl sm:text-3xl font-bold text-[#394B32]">Mes tâches</h2>
                <p class="text-gray-500 mt-2">
                    Gérez et suivez toutes vos tâches au même endroit.
                </p>
            </div>

            <!-- FILTERS -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 items-end gap-4">

                    <button id="btnAjouter"
                        class="bg-[#394B32] hover:bg-[#526A48] text-white px-5 py-3 rounded-xl font-semibold cursor-pointer transition-all duration-200 hover:shadow-md active:scale-95 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i>
                        Ajouter Une Tache
                    </button>

                    <div class="flex flex-col gap-2 flex-1 min-w-[150px]">
                        <label for="filterStatus" class="text-sm font-semibold text-gray-600">
                            Statut
                        </label>

                        <select name="StatutFiltre" id="filterStatus"
                            class="border border-gray-200 rounded-xl px-4 py-3 bg-gray-50 outline-none focus:ring-2 focus:ring-[#526A48] focus:border-transparent">
                            <option value="all">Tous les statuts</option>
                            <option value="todo">Todo</option>
                            <option value="inprogress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2 flex-1 min-w-[150px]">
                        <label for="Search" class="text-sm font-semibold text-gray-600">
                            Recherche
                        </label>

                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                            <input type="search" placeholder="Rechercher une tâche..."
                                name="search" id="search"
                                class="w-full border border-gray-200 rounded-xl pl-11 pr-4 py-3 bg-gray-50 outline-none focus:ring-2 focus:ring-[#526A48] focus:border-transparent">
                        </div>
                    </div>

                    <div class="flex flex-col gap-2 flex-1 min-w-[150px]">
                        <label for="names" class="text-sm font-semibold text-gray-600">
                            Responsable
                        </label>

                        <select name="names" id="SelectNames"
                            class="border border-gray-200 rounded-xl px-4 py-3 bg-gray-50 outline-none focus:ring-2 focus:ring-[#526A48] focus:border-transparent">
                        </select>
                    </div>

                    <button id="btnReset"
                        class="bg-[#F0F2EC] text-[#394B32] px-5 py-3 rounded-xl font-semibold cursor-pointer hover:bg-[#E1E7DB] transition-all duration-200 flex items-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i>
                        Reset
                    </button>

                </div>
            </div>

        </section>


        <!-- TASK COLUMNS -->
<section class="cartes ">       
         <!-- TODO -->
            <div class="Todo ">
               
            </div>

            <!-- IN PROGRESS -->
            <div class="inProgress ">
               
            </div>

            <!-- DONE -->
            <div class="Done ">
              
            </div>

        </section>


        <!-- MODAL -->
        <dialog id="addCardDialog"
            class="m-auto w-[95%] max-w-lg rounded-2xl shadow-2xl backdrop:bg-black/50 p-0">

            <form action="" id="formAddDialog" class="bg-white p-7">

                <div class="mb-7 flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-[#394B32]">Nouvelle tâche</h2>
                        <p class="text-sm text-gray-500 mt-1">Remplissez les informations ci-dessous.</p>
                    </div>

                    <div class="w-11 h-11 rounded-xl bg-[#E9EFE5] flex items-center justify-center text-[#394B32]">
                        <i class="fa-solid fa-clipboard-list text-xl"></i>
                    </div>
                </div>


                <div class="space-y-4">

                    <div class="flex flex-col gap-2">
                        <label for="Titre" class="text-sm font-semibold text-gray-700">Titre</label>
                        <input type="text" id="Titre" name="titre" required
                            placeholder="Titre de la tâche"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#526A48]">
                    </div>


                    <div class="flex flex-col gap-2">
                        <label for="description" class="text-sm font-semibold text-gray-700">Description</label>
                        <textarea name="description" id="description"
                            placeholder="Décrivez votre tâche..."
                            rows="3"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#526A48] resize-none"></textarea>
                    </div>


                    <div class="flex flex-col gap-2">
                        <label for="Responsable" class="text-sm font-semibold text-gray-700">Responsable</label>
                        <input type="text" id="Responsable" name="Responsable" required
                            placeholder="Nom du responsable"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#526A48]">
                    </div>


                    <div class="grid grid-cols-2 gap-4">

                        <div class="flex flex-col gap-2">
                            <label for="Priorité" class="text-sm font-semibold text-gray-700">Priorité</label>
                            <select name="Priorité" id="Priorité"
                                class="w-full border border-gray-200 rounded-xl px-3 py-3 bg-white outline-none focus:ring-2 focus:ring-[#526A48]">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="Statut" class="text-sm font-semibold text-gray-700">Statut</label>
                            <select name="Statut" id="Statut"
                                class="w-full border border-gray-200 rounded-xl px-3 py-3 bg-white outline-none focus:ring-2 focus:ring-[#526A48]">
                                <option value="todo">Todo</option>
                                <option value="inprogress">In Progress</option>
                                <option value="done">Done</option>
                            </select>
                        </div>

                    </div>


                    <div class="flex flex-col gap-2">
                        <label for="date" class="text-sm font-semibold text-gray-700">Date limite</label>
                        <input type="date" id="date" name="date"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#526A48]">
                    </div>

                </div>


                <div class="flex gap-3 mt-8">

                    <button id="btnAjoutermodal" type="submit" name="btnAjoutermodal"
                        class="flex-1 bg-[#394B32] hover:bg-[#526A48] text-white py-3 rounded-xl font-semibold cursor-pointer transition-all">
                        <i class="fa-solid fa-plus mr-2"></i>
                        Ajouter
                    </button>

                    <button id="btnModifiermodal" type="button" name="btnModifiermodal" hidden
                        class="flex-1 bg-[#394B32] hover:bg-[#526A48] text-white py-3 rounded-xl font-semibold cursor-pointer transition-all">
                        <i class="fa-solid fa-plus mr-2"></i>
                        Modifier
                    </button>

                    <button id="btnAnnulerModal" type="button"
                        class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold cursor-pointer transition-all">
                        Annuler
                    </button>

                </div>

            </form>
        </dialog>

    </main>

</body>

</html>
